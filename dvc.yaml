stages:
  validate:
    cmd: uv run --locked python -m src.validate_data
    deps:
      - src/validate_data.py
      - data/raw
      - pyproject.toml
      - uv.lock
    metrics:
      - reports/data_quality.json

  prepare:
    cmd: uv run --locked python -m src.prepare
    deps:
      - src/prepare.py
      - data/raw
      - reports/data_quality.json
      - pyproject.toml
      - uv.lock
    params:
      - data.image_size
    outs:
      - data/processed
    metrics:
      - reports/data_summary.json

  train:
    cmd: uv run --locked python -m src.train
    deps:
      - src/train.py
      - src/data.py
      - src/model.py
      - src/provenance.py
      - src/reproducibility.py
      - data/processed/train
      - data/processed/validation
      - data/processed/manifests/train.csv
      - data/processed/manifests/validation.csv
      - pyproject.toml
      - uv.lock
    params:
      - data.image_size
      - train.batch_size
      - train.epochs
      - train.learning_rate
      - train.dropout
      - train.random_state
      - augmentation.enabled
      - augmentation.horizontal_flip
      - augmentation.rotation_degrees
      - compute.device
      - tracking.uri
      - tracking.experiment
    outs:
      - models/model.pt     # local model file tracked by DVC
      - reports/training_curves.png
      - reports/run_manifest.json
    metrics:
      - reports/train_summary.json

  evaluate:
    cmd: uv run --locked python -m src.evaluate
    deps:
      - src/evaluate.py
      - src/data.py
      - src/provenance.py
      - src/reproducibility.py
      - data/processed/test
      - data/processed/manifests/train.csv
      - data/processed/manifests/validation.csv
      - pyproject.toml
      - uv.lock
    params:
      - data.image_size
      - compute.device
      - tracking.uri
      - tracking.experiment
      - selection.run_id
      - evaluation.batch_size
    outs:
      - reports/test_confusion_matrix.png
    metrics:
      - reports/test_metrics.json